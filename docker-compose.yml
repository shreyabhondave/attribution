# Optional: a local PostgreSQL for the service.   docker compose up -d
# Then:  DATABASE_URL=postgresql://postgres:postgres@localhost:5432/urbanthread  python -m uvicorn app.main:app --port 8000
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urbanthread
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # one extra database for the test-suite (the tests TRUNCATE tables, so they never touch `urbanthread`)
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urbanthread"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
